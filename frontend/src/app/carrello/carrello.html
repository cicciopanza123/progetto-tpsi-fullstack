<h1>Carrello</h1>

<p>Numero prodotti: {{ cartService.getProdotti().length }}</p>

@for (prodotto of cartService.getProdotti(); track prodotto.id) {

  <div>
    <h2>{{ prodotto.nome }}</h2>

    <p>Prezzo: € {{ prodotto.prezzo }}</p>

    <p>Prezzo IVA: € {{ prodotto.prezzo_ivato }}</p>
  </div>

}
